<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="A long verbose prompt compressed into a short optimized one, with a token savings badge">
  <defs>
    <linearGradient id="poBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151622"/>
      <stop offset="1" stop-color="#1C1E2D"/>
    </linearGradient>
    <linearGradient id="poAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="poGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="poGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#poBg)"/>
  <rect width="800" height="500" fill="url(#poGrid)"/>
  <ellipse cx="200" cy="420" rx="240" ry="180" fill="url(#poGlow)"/>

  <!-- verbose prompt -->
  <g>
    <text x="56" y="68" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#6B7280" letter-spacing="1.5">VERBOSE</text>
    <rect x="56" y="86" width="688" height="140" rx="12" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.10)"/>
    <g stroke="rgba(255,255,255,0.22)" stroke-width="8" stroke-linecap="round">
      <path d="M84 114h620"/>
      <path d="M84 138h560"/>
      <path d="M84 162h644"/>
      <path d="M84 186h468"/>
    </g>
    <g transform="translate(636,44)">
      <rect width="108" height="26" rx="13" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
      <text x="54" y="18" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#9CA3AF">1,240 tokens</text>
    </g>
  </g>

  <!-- scan / compress arrow -->
  <g transform="translate(0,246)">
    <line x1="56" y1="20" x2="330" y2="20" stroke="rgba(255,255,255,0.10)" stroke-width="2"/>
    <line x1="470" y1="20" x2="744" y2="20" stroke="rgba(255,255,255,0.10)" stroke-width="2"/>
    <g transform="translate(348,0)">
      <rect width="104" height="40" rx="20" fill="rgba(139,92,246,0.16)" stroke="url(#poAccent)" stroke-width="1.5"/>
      <text x="52" y="26" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#DDD6FE">optimize</text>
    </g>
    <path d="M400 46v16" stroke="url(#poAccent)" stroke-width="3" stroke-linecap="round"/>
    <path d="M392 56l8 9 8-9" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- optimized prompt -->
  <g>
    <text x="56" y="342" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#A78BFA" letter-spacing="1.5">OPTIMIZED</text>
    <rect x="56" y="360" width="688" height="92" rx="12" fill="rgba(139,92,246,0.08)" stroke="rgba(139,92,246,0.4)"/>
    <g stroke="url(#poAccent)" stroke-width="8" stroke-linecap="round">
      <path d="M84 392h360"/>
      <path d="M84 420h248"/>
    </g>
    <g transform="translate(614,378)">
      <rect width="102" height="56" rx="12" fill="rgba(56,189,248,0.14)" stroke="rgba(56,189,248,0.5)"/>
      <text x="51" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="700" fill="#7DD3FC">−52%</text>
      <text x="51" y="44" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#6B7280">tokens</text>
    </g>
  </g>
</svg>
